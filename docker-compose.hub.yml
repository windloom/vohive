services:
  vohive:
    image: skyhotspur/vohive:1.5.5
    container_name: vohive
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - /opt/vohive/config:/app/config
      - /opt/vohive/data:/app/data
      - /opt/vohive/logs:/app/logs
      - /dev:/dev
    environment:
      - TZ=Asia/Singapore
      - CONFIG_PATH=/app/config/config.yaml
